name: ship-to-server

# Ships merged front-end work: moves the traccar-web submodule in
# CashControlGroup/traccar custom/main to this commit and pushes. That push
# triggers the server fork's build-and-push, which deploys.
# SERVER_PUSH_TOKEN: fine-grained PAT with Contents read/write on
# CashControlGroup/traccar (a GITHUB_TOKEN push would not trigger the build).

on:
  push:
    branches: [ custom/main ]

concurrency:
  group: ship-to-server
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server fork custom/main
        uses: actions/checkout@v4
        with:
          repository: CashControlGroup/traccar
          ref: custom/main
          token: ${{ secrets.SERVER_PUSH_TOKEN }}

      # The server's .gitmodules sets `ignore = all`, which hides submodule
      # changes from git diff/status/commit -a, so read and write the pointer
      # directly instead of checking the submodule out.
      - name: Move submodule pointer to this commit and push
        run: |
          CURRENT=$(git rev-parse HEAD:traccar-web)
          if [ "$CURRENT" = "$GITHUB_SHA" ]; then
            echo "Server fork already points at ${GITHUB_SHA}; nothing to ship."
            exit 0
          fi
          git update-index --cacheinfo "160000,${GITHUB_SHA},traccar-web"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Advance traccar-web submodule to ${GITHUB_SHA::8}"
          git push origin HEAD:custom/main
          echo "Shipped: ${CURRENT::8} -> ${GITHUB_SHA::8}"
