name: custom-ci

# Lint and build every PR into custom/main. Upstream's build.yml and lint.yml
# only cover master; this file is ours so upstream merges never touch it.

on:
  pull_request:
    branches: [ custom/main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm ci --prefix demo
      - run: npm run lint
      - run: npm run build
